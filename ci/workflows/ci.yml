name: CI

# No cloud resources here. Checks: scripts parse, offline selftest with a
# pretend AWS passes, and nothing that looks like a secret or id is committed.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Syntax, selftest, secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check scripts/lens.mjs && node --check scripts/selftest.mjs
      - name: Selftest
        run: node scripts/selftest.mjs
      - name: ShellCheck
        run: shellcheck -S warning scripts/*.sh
      - name: Secret scan
        run: |
          if grep -rInE --exclude-dir=.git 'AKIA[0-9A-Z]{16}|BEGIN (RSA|PRIVATE)|dev[0-9]{6}|ghp_[A-Za-z0-9]{20}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|:[0-9]{12}:' .; then
            echo "Found something that looks like a secret or id."; exit 1
          fi
